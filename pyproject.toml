[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "green-fraud-fields"
version = "0.1.0"
description = "Causal Green-field graph features for fraud and illicit-transaction ranking."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maksim Kosmakov" }]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "lightgbm>=4.0",
  "pyarrow>=15",
  "matplotlib>=3.8",
  "kaggle>=1.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
